name: Fill History (Deep Green)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '开始日期 (YYYY-MM-DD)'
        required: true
        default: '2025-04-23'
      end_date:
        description: '结束日期 (YYYY-MM-DD) - 留空则默认为今天'
        required: false
        default: ''
      daily_commits:
        description: '每天提交次数'
        required: true
        default: '10'

jobs:
  fill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config --global user.email "oxxxxlin@gmail.com"
          git config --global user.name "oxxxxlin"
      - name: Generate historical commits
        env:
          START: ${{ github.event.inputs.start_date }}
          END: ${{ github.event.inputs.end_date }}
          DAILY_COUNT: ${{ github.event.inputs.daily_commits }}
        run: |
          if [ -z "$END" ]; then
            END=$(date +%Y-%m-%d)
          fi
          current_date="$START"
          while [ "$current_date" != "$END" ]; do
            echo "Generating $DAILY_COUNT commits for $current_date"
            for i in $(seq 1 $DAILY_COUNT); do
              export GIT_AUTHOR_DATE="$current_date 12:00:00"
              export GIT_COMMITTER_DATE="$current_date 12:00:00"
              git commit --allow-empty -m "chore: sync #$i on $current_date"
            done
            current_date=$(date -d "$current_date + 1 day" +%Y-%m-%d)
          done
      - name: Push commits
        run: git push --force origin HEAD
